services:
  bonsai:
    image: mhald/ternary-bonsai-27b-gguf-llamacpp-cuda:v4
    container_name: bonsai-27b
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/Ternary-Bonsai-27B-Q2_g64.gguf
      -a bonsai-27b
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 3
      -c 262144
      -ct vbr
      --kv-unified
      --no-mmproj
      --temp 0.7
      --top-p 0.95
      --top-k 20
      --min-p 0.1
      --xtc-probability 0.8
      --xtc-threshold 0.2
      --presence-penalty 0.3
      --repeat-penalty 1.0
      --cache-ram 4096
      -lv 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

services:
  bonsai:
    image: mhald/ternary-bonsai-27b-gguf-llamacpp-cuda:v4
    container_name: bonsai-27b
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    # Every flag below is explained in the README; the two that surprise people:
    #
    #   -c 262144 -ct vbr   The model's full context, on a 12 GB card. VBR keeps
    #                       the KV cache at f16 and degrades it tier by tier only
    #                       under real VRAM pressure, so shallow sessions cost no
    #                       quality at all. See "VBR — the reason for v4".
    #
    #   --presence-penalty 0.0
    #                       Thinking models fall into repetition loops, and a mild
    #                       0.3 used to be the guard here. But a sampler penalty
    #                       only sees token probabilities — it cannot tell
    #                       legitimate repetition during reasoning from a real
    #                       loop, which is exactly how the DRY sampler made this
    #                       model hallucinate. If your client breaks loops on
    #                       observed behaviour instead (pi's loop-guard does),
    #                       the penalty is redundant and 0.0 buys maximum code
    #                       fidelity. Put it back to 0.3 if nothing else is
    #                       watching for loops. See "Extensions in use".
    #
    # Note there is deliberately no --cache-ram: dynamic VBR disables the
    # host-RAM prompt cache, so the flag would be a no-op.
    command: >
      -m /models/Ternary-Bonsai-27B-Q2_g64.gguf
      -a bonsai-27b
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -np 3
      -c 262144
      -ct vbr
      --kv-unified
      --no-mmproj
      --temp 0.7
      --top-p 0.95
      --top-k 20
      --min-p 0.1
      --xtc-probability 0.8
      --xtc-threshold 0.2
      --presence-penalty 0.0
      --repeat-penalty 1.0
      -lv 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

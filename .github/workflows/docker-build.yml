name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel base image + build tree need more disk than the
      # default runner offers; drop preinstalled toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: mhald/ternary-bonsai-27b-gguf-llamacpp-cuda
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Measured, not guessed: with ggml's default architecture set this
          # job hits the runner's hard 6 h limit and is killed mid-build (runs
          # 31229574507 and 31229783962, both cancelled at 6h00m). The fork has
          # ~600 CUDA translation units against v3's ~200, and the TurboQuant
          # flash-attention templates are far more expensive than average, so
          # v3's 1h15m does not extrapolate.
          #
          # A measured pass costs ~1h12m here (3 passes = 3h37m, run
          # 31243802306), so four fit with roughly an hour to spare.
          #   75-virtual  PTX floor. PTX is forward-compatible, so ONE low
          #               virtual target lets every GPU from Turing up JIT on
          #               first run. Never drop this — a list of only *-real
          #               targets publishes an image that refuses to start on
          #               anything not explicitly compiled.
          #   86-real     Ampere consumer (RTX 30xx)
          #   89-real     Ada (RTX 40xx) — what this repo targets
          #   120-real    Blackwell consumer (RTX 50xx)
          #
          # Why the *-real entries matter more than "it would just be slower":
          # ggml picks kernel variants host-side via
          # ggml_cuda_highest_compiled_arch(), which for an uncompiled cc
          # returns the highest arch BELOW it — e.g. 890 on a Blackwell card.
          # The only device code actually available there is the JIT from the
          # 75 PTX, i.e. the Turing path. Host choice and device code can then
          # disagree, and fattn-mma-f16.cuh aborts via NO_DEVICE_CODE rather
          # than degrading. Treat any architecture not listed here as untested,
          # not as "works, just slower" — that includes datacenter parts
          # (80 = A100, 90 = Hopper), which do not fit the time budget.
          build-args: |
            CUDA_DOCKER_ARCH=75-virtual;86-real;89-real;120-real
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sync README.md as the Docker Hub repo description.
      # Needs a token with "Read, Write, Delete" scope; failure here must not
      # fail the image build.
      - name: Sync README to Docker Hub
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mhald/ternary-bonsai-27b-gguf-llamacpp-cuda
          short-description: "Ternary Bonsai 27B GGUF on buun-llama-cpp (CUDA Q2_0 + VBR KV cache), full 262K context, OpenAI-compatible API"

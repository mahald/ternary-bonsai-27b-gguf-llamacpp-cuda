name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel base image + build tree need more disk than the
      # default runner offers; drop preinstalled toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: mhald/ternary-bonsai-27b-gguf-llamacpp-cuda
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No CUDA_DOCKER_ARCH override on purpose. ggml's default set mixes
          # real (SASS) targets for the common GPUs with virtual (PTX) ones for
          # the rest, so any architecture without device code still JITs on
          # first run. Pinning a list of *-real targets would publish an image
          # that simply refuses to start on everything else.
          #
          # Since v4 this builds the buun fork, ~600 CUDA translation units
          # instead of ~200 (every TurboQuant tier ships its own
          # flash-attention instances), so expect the job to run several hours
          # — v3 took ~1h15m. Still inside the 6 h job limit, and the gha cache
          # below keeps repeat runs cheap.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sync README.md as the Docker Hub repo description.
      # Needs a token with "Read, Write, Delete" scope; failure here must not
      # fail the image build.
      - name: Sync README to Docker Hub
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mhald/ternary-bonsai-27b-gguf-llamacpp-cuda
          short-description: "Ternary Bonsai 27B GGUF on buun-llama-cpp (CUDA Q2_0 + VBR KV cache), full 262K context, OpenAI-compatible API"

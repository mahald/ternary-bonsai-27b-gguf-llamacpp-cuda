name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel base image + build tree need more disk than the
      # default runner offers; drop preinstalled toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: mhald/ternary-bonsai-27b-gguf-llamacpp-cuda
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Since v4 the image builds the buun fork: ~600 CUDA translation
          # units instead of ~200, because every TurboQuant tier ships its own
          # flash-attention instances. ggml's "default" multi-arch set would
          # multiply that past this runner's 6 h job limit (a single-arch build
          # already takes ~50 min on 6 fast cores). So publish for the consumer
          # generations this setup actually targets — Ampere, Ada, Blackwell.
          # Widen the list if you need Turing (75) or datacenter parts (80, 90,
          # 100); expect the build time to scale with it.
          build-args: |
            CUDA_DOCKER_ARCH=86-real;89-real;120-real
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sync README.md as the Docker Hub repo description.
      # Needs a token with "Read, Write, Delete" scope; failure here must not
      # fail the image build.
      - name: Sync README to Docker Hub
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mhald/ternary-bonsai-27b-gguf-llamacpp-cuda
          short-description: "Ternary Bonsai 27B GGUF on buun-llama-cpp (CUDA Q2_0 + VBR KV cache), full 262K context, OpenAI-compatible API"
